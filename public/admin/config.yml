backend:
  name: github
  repo: locks619/safecracker.com
  branch: main
  base_url: https://safecracker-oauth.locks619.workers.dev

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: https://safecrackerinc.com
display_url: https://safecrackerinc.com

collections:
  # ─── BLOG / NEWS POSTS ───
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # ─── JOB GALLERY (phone uploads) ───
  - name: "gallery"
    label: "Job Gallery"
    folder: "src/content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Job Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["Commercial Locksmith", "Safe & Vault", "Gate Automation", "Door Hardware", "Emergency Lockout", "Access Control"] }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Before Photo", name: "before_image", widget: "image", required: false }
      - { label: "Description", name: "body", widget: "markdown", required: false }

  # ─── TESTIMONIALS ───
  - name: "testimonials"
    label: "Testimonials"
    folder: "src/content/testimonials"
    create: true
    fields:
      - { label: "Customer Name", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Service Type", name: "service", widget: "select", options: ["Commercial Locksmith", "Safe & Vault", "Gate Automation", "Door Hardware", "Emergency Lockout", "Access Control"] }
      - { label: "Rating", name: "rating", widget: "number", min: 1, max: 5, default: 5 }
      - { label: "Review", name: "body", widget: "text" }

  # ─── SITE SETTINGS ───
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Business Info"
        name: "business"
        file: "src/content/settings/business.json"
        fields:
          - { label: "Business Name", name: "name", widget: "string", default: "Safecracker Locksmith & Safe Services" }
          - { label: "Phone", name: "phone", widget: "string", default: "(619) 794-8355" }
          - { label: "License", name: "license", widget: "string", default: "LCO 6687" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Service Radius", name: "radius", widget: "string", default: "150 miles" }
          - { label: "Emergency Available", name: "emergency", widget: "boolean", default: true }
